    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: #fafafa;
        }

        .swagger-ui .topbar {
            background: #fff !important;
        }

        .swagger-ui .topbar a {
            max-width: 100%;
        }

        .topbar-wrapper img[alt="Swagger UI"],
        .topbar-wrapper span {
            display: none;
        }

        .topbar-wrapper .link:before {
            content: url("//cdn.syncfusion.com/documentation/images/sync-logo.svg");
        }

        .topbar-wrapper .link:after {
            content: "Bold Reports";
            margin-left: 10px;
        }

        .download-url-wrapper {
            display: none !important;
        }

        .swagger-ui .info hgroup.main a {
            display: none !important;
        }

        .page-heading {
            display: none;
        }
    </style>

<body>
    <header id="header-container">
        <div class="container">
            <div id="header-left-side">
                <a href="/" class="header-home-link">
                    <div class="header-logo"></div>
                </a>
                <span class="header-docs-text">
                    <a href="/enterprise-reporting/">Enterprise</a>
                </span>
            </div>

            <div id="header-right-side">
                <div class="header-links">
                    <a href="https://www.boldreports.com/forums/" class="header-menu-link" target="_blank"
                        rel="noreferrer">
                        Forum

                    <a href="https://support.boldreports.com/kb" class="header-menu-link" target="_blank"
                        rel="noreferrer">
                        KB
                    </a>
                    <a href="https://app.boldid.net/register/reports/enterprise?evaluation=v2"
                        class="header-try-it-free-btn" target="_blank" rel="noreferrer">
                        Try it Free
                    </a>
                </div>
            </div>
        </div>
    </header>

    <h1 class="page-heading">Rest API Reference version 4.0</h1>
    <div id="swagger-ui"></div>

    <footer id="footer-container">
        <div id="footer-leftside">
            <a id="footer-copyright" target="_blank" rel="noreferrer"
                href="https://www.boldreports.com/resources/copyright/">
                Copyright © 2001 - <span id="footer-copyright-year">{currentYear}</span> Syncfusion Inc. All Rights
                Reserved
            </a>
        </div>
        <div class="footer-rightside">
            <a class="footer-links" href="https://www.boldreports.com/legal/terms-of-use/" target="_blank"
                rel="noreferrer">
                Terms of Use
            </a>
            <a class="footer-links" href="https://www.boldreports.com/legal/privacy/" target="_blank" rel="noreferrer">
                Privacy Policy
            </a>
            <a class="footer-links" href="https://www.boldreports.com/legal/cookie-policy/" target="_blank"
                rel="noreferrer">
                Cookie Policy
            </a>
        </div>
    </footer>

    <script src="./../../common/try-it-now/swagger-ui-bundle.js"></script>
    <script src="./../../common/try-it-now/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function () {
            // Begin Swagger UI call region
            const ui = SwaggerUIBundle({
                url: "./swagger4.0.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            })
            window.ui = ui
            // End Swagger UI call region

            // Update footer current year
            var currentYear = new Date().getFullYear();
            document.getElementById('footer-copyright-year').innerText = currentYear;
        }

        // SiteVisitor Tracking
        document.addEventListener('DOMContentLoaded', function () {
            function loadTrackingScript() {
                const script = document.createElement("script");
                script.src = `https://cdn.boldreports.com/website/js/tracking.js?v=${Date.now()}`;
                script.async = true;
                document.head.appendChild(script);
            }

            loadTrackingScript();
        });
    </script>
</body>

</html>
